project:
  name: Freight Rate Prediction Assessment
  version: "1.0.0"
  author: "Your Name"
  random_seed: 42

paths:
  train_data: "data/train_test.csv"
  validation_data: "data/validation.csv"
  validation_template: "data/validation_predictions_template.csv"
  december_data: "data/december_chart_inputs.csv"

  artifacts_dir: "artifacts"
  outputs_dir: "outputs"
  reports_dir: "reports"

training:
  validation_size: 0.20
  time_series_split: true
  cv_folds: 5

models:
  use_lightgbm: true
  use_xgboost: true
  use_catboost: true
  use_hist_gradient_boosting: true

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

api:
  host: "0.0.0.0"
  port: 8000