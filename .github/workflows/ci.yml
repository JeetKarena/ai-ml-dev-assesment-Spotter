name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt black ruff

      - name: Check formatting
        run: python -m black --check .

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Validate submission files
        run: python score.py --predictions outputs/validation_predictions.csv --december-predictions outputs/december_predictions.csv --output-dir outputs/scorer_results

      - name: Upload December chart
        uses: actions/upload-artifact@v7
        with:
          name: december-chart
          path: outputs/scorer_results/candidate_december.png
          if-no-files-found: error

  docker:
    name: Build Docker images
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build training image
        run: docker build -t spotter-assessment:ci .
      - name: Build API image
        run: docker build -f api/Dockerfile -t spotter-api:ci .
